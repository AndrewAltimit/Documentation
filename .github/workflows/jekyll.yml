---
name: Jekyll Build and Deploy

on:
  push:
    branches:
      - update-docs
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy Jekyll config to github-pages directory
        run: |
          cp _config.yml github-pages/
          cp Gemfile github-pages/
          cp Gemfile.lock github-pages/ || true
          mkdir -p github-pages/assets/css
          cp -r assets/css/* github-pages/assets/css/ || true

      # Build with a multi-arch ruby image rather than the amd64-only
      # jekyll/jekyll image, so the publish runs natively on any self-hosted
      # runner architecture (the host pool includes arm64).
      - name: Build Jekyll site
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/github-pages:/srv/jekyll" \
            -v "${{ github.workspace }}/_site:/srv/jekyll/_site" \
            -w /srv/jekyll \
            ruby:3.2-slim \
            /bin/bash -c "apt-get update -qq && apt-get install -y -qq build-essential git >/dev/null && gem install bundler -q && bundle install && bundle exec jekyll build"

      - name: Fix build artifact ownership
        if: always()
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" busybox:1.36.1 \
            chown -Rh "$(id -u):$(id -g)" /workspace/_site 2>/dev/null || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          cname: false