---
name: Jekyll Build and Deploy

on:
  push:
    branches:
      - update-docs
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy Jekyll config to github-pages directory
        run: |
          cp _config.yml github-pages/
          cp Gemfile github-pages/
          cp Gemfile.lock github-pages/ || true
          mkdir -p github-pages/assets/css
          cp -r assets/css/* github-pages/assets/css/ || true

      # Build with a multi-arch ruby image rather than the amd64-only
      # jekyll/jekyll image, so the publish runs natively on any self-hosted
      # runner architecture (the host pool includes arm64).
      - name: Build Jekyll site
        run: |
          docker run --rm \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -v "${{ github.workspace }}/github-pages:/srv/jekyll" \
            -v "${{ github.workspace }}/_site:/srv/jekyll/_site" \
            -w /srv/jekyll \
            ruby:3.2-slim \
            /bin/bash -c '
              set -e
              # The container runs as root; hand ownership of everything it writes
              # (_site/, .jekyll-cache/, Gemfile.lock) back to the runner user on
              # ANY exit so root-owned files never break the next checkout cleanup.
              # /srv/jekyll covers github-pages AND the _site mount nested under it.
              trap "chown -R $HOST_UID:$HOST_GID /srv/jekyll 2>/dev/null || true" EXIT
              apt-get update -qq && apt-get install -y -qq build-essential git >/dev/null
              gem install bundler -q
              bundle install
              bundle exec jekyll build
            '

      # Safety net for the case where the container is SIGKILL'd before the trap runs.
      - name: Reclaim build artifact ownership
        if: always()
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" busybox:1.36.1 \
            chown -Rh "$(id -u):$(id -g)" /workspace/_site /workspace/github-pages 2>/dev/null || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          cname: false