---
name: Pull Request Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Fork guard: block fork PRs from running on self-hosted runners with write perms
  fork-guard:
    name: Fork PR Guard
    runs-on: self-hosted
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - run: echo "Not a fork PR - proceeding"

  # Validate the documentation site: link integrity + Jekyll build
  validate:
    name: Documentation Validation
    needs: fork-guard
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          ref: ${{ github.head_ref }}

      # Assemble the build inputs exactly as the deploy workflow does.
      - name: Assemble Jekyll source
        run: |
          cp _config.yml github-pages/
          cp Gemfile github-pages/
          cp Gemfile.lock github-pages/ || true
          mkdir -p github-pages/assets/css
          cp -r assets/css/* github-pages/assets/css/ || true

      # Build + link-check in one multi-arch ruby container (avoids the
      # amd64-only jekyll/jekyll image, which segfaults on arm64 runners).
      # The Jekyll build catches Liquid/front-matter errors; html-proofer
      # validates internal links and anchors against the rendered _site.
      # --swap-urls strips the /Documentation baseurl so root-relative links
      # resolve; --checks Links scopes it to link integrity (not alt-text);
      # --disable-external/--no-enforce-https keep CI off the network.
      - name: Build site and check links
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/github-pages:/srv/jekyll" \
            -w /srv/jekyll \
            ruby:3.2-slim \
            /bin/bash -c "apt-get update -qq && apt-get install -y -qq build-essential git libcurl4 >/dev/null && gem install bundler -q && bundle install && bundle exec jekyll build && bundle exec htmlproofer ./_site --checks Links --disable-external --no-enforce-https --swap-urls '^/Documentation/:/'"

      - name: Fix build artifact ownership
        if: always()
        run: |
          docker run --rm -v "${{ github.workspace }}/github-pages:/workspace" busybox:1.36.1 \
            chown -Rh "$(id -u):$(id -g)" /workspace/_site /workspace/.jekyll-cache 2>/dev/null || true

  # Status summary
  pr-status:
    name: PR Status Summary
    needs: [fork-guard, validate]
    if: always()
    runs-on: self-hosted
    steps:
      - name: Generate status summary
        run: |
          echo "## PR Validation Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Documentation Validation | ${{ needs.validate.result }} |" >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ needs.validate.result }}" == "failure" ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Validation failed - please review the logs" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "PR validation completed successfully" >> "$GITHUB_STEP_SUMMARY"
