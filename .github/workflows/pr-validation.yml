---
name: Pull Request Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Fork guard: block fork PRs from running on self-hosted runners with write perms
  fork-guard:
    name: Fork PR Guard
    runs-on: self-hosted
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - run: echo "Not a fork PR - proceeding"

  # Validate the documentation site: link integrity + Jekyll build
  validate:
    name: Documentation Validation
    needs: fork-guard
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true
          ref: ${{ github.head_ref }}

      # md-link-checker is a Rust tool installed on the self-hosted runner.
      # Skip gracefully if it isn't on PATH so the build stays the source of truth.
      - name: Markdown link check (internal)
        run: |
          if ! command -v md-link-checker &>/dev/null; then
            echo "::warning::md-link-checker not found on PATH - skipping link check"
            exit 0
          fi
          set -o pipefail
          FAIL=0
          for target in *.md github-pages/docs/; do
            [ -e "$target" ] || continue
            md-link-checker "$target" --internal-only 2>&1 | tee -a link_check_output.txt || FAIL=1
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "### Markdown Link Check" >> "$GITHUB_STEP_SUMMARY"
            grep -E '(broken link|not found)' link_check_output.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          fi
          exit $FAIL

      # Build the site exactly as the deploy workflow does, to catch
      # Liquid/front-matter/config breakage before it reaches main.
      - name: Assemble Jekyll source
        run: |
          cp _config.yml github-pages/
          cp Gemfile github-pages/
          cp Gemfile.lock github-pages/ || true
          mkdir -p github-pages/assets/css
          cp -r assets/css/* github-pages/assets/css/ || true

      # Build with a multi-arch ruby image rather than the amd64-only
      # jekyll/jekyll image, so the build runs natively on any self-hosted
      # runner architecture (the host pool includes arm64).
      - name: Build Jekyll site
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/github-pages:/srv/jekyll" \
            -w /srv/jekyll \
            ruby:3.2-slim \
            /bin/bash -c "apt-get update -qq && apt-get install -y -qq build-essential git >/dev/null && gem install bundler -q && bundle install && bundle exec jekyll build"

      - name: Fix build artifact ownership
        if: always()
        run: |
          docker run --rm -v "${{ github.workspace }}/github-pages:/workspace" busybox:1.36.1 \
            chown -Rh "$(id -u):$(id -g)" /workspace/_site /workspace/.jekyll-cache 2>/dev/null || true

  # Status summary
  pr-status:
    name: PR Status Summary
    needs: [fork-guard, validate]
    if: always()
    runs-on: self-hosted
    steps:
      - name: Generate status summary
        run: |
          echo "## PR Validation Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Documentation Validation | ${{ needs.validate.result }} |" >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ needs.validate.result }}" == "failure" ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Validation failed - please review the logs" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "PR validation completed successfully" >> "$GITHUB_STEP_SUMMARY"
