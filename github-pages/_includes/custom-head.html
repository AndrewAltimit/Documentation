<!-- Theme (light/dark): apply saved/preferred theme before paint to avoid a flash -->
<script>
(function () {
  try {
    var saved = localStorage.getItem('theme');
    var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    var theme = saved || (prefersDark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>

<!-- Mobile navigation toggle script -->
<script>
document.addEventListener('DOMContentLoaded', function() {
  // Mobile menu functionality.
  // The toggle/overlay are always created; CSS media queries control whether
  // the toggle is visible, so resizing across the breakpoint behaves correctly.
  var sidebar = document.querySelector('.sidebar.sticky');
  if (sidebar && !document.querySelector('.nav-toggle')) {
    var toggleBtn = document.createElement('button');
    toggleBtn.className = 'nav-toggle';
    toggleBtn.type = 'button';
    toggleBtn.innerHTML = '☰ Menu';
    toggleBtn.setAttribute('aria-label', 'Toggle navigation menu');
    toggleBtn.setAttribute('aria-expanded', 'false');
    document.body.appendChild(toggleBtn);

    var overlay = document.createElement('div');
    overlay.className = 'sidebar-overlay';
    document.body.appendChild(overlay);

    function closeNav() {
      sidebar.classList.remove('active');
      overlay.classList.remove('active');
      toggleBtn.setAttribute('aria-expanded', 'false');
    }

    toggleBtn.addEventListener('click', function() {
      var open = sidebar.classList.toggle('active');
      overlay.classList.toggle('active', open);
      toggleBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    });

    overlay.addEventListener('click', closeNav);

    // Close the menu after following a link, and on Escape.
    sidebar.addEventListener('click', function(e) {
      if (e.target.closest('a')) { closeNav(); }
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') { closeNav(); }
    });

    // Reset state when resizing back to desktop.
    var resizeTimer;
    window.addEventListener('resize', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function() {
        if (window.innerWidth > 1023) { closeNav(); }
      }, 200);
    });
  }
});
</script>

<!-- Light/dark theme toggle button -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  if (document.querySelector('.theme-toggle')) return;
  var root = document.documentElement;
  var btn = document.createElement('button');
  btn.className = 'theme-toggle';
  btn.type = 'button';

  function isDark() { return root.getAttribute('data-theme') === 'dark'; }
  function render() {
    var dark = isDark();
    btn.innerHTML = dark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    var label = dark ? 'Switch to light theme' : 'Switch to dark theme';
    btn.setAttribute('aria-label', label);
    btn.setAttribute('title', label);
  }
  render();

  btn.addEventListener('click', function () {
    var next = isDark() ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
    render();
  });

  // Follow OS changes only when the user hasn't made an explicit choice.
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var onChange = function (e) {
      var saved;
      try { saved = localStorage.getItem('theme'); } catch (err) { saved = null; }
      if (!saved) { root.setAttribute('data-theme', e.matches ? 'dark' : 'light'); render(); }
    };
    if (mq.addEventListener) { mq.addEventListener('change', onChange); }
    else if (mq.addListener) { mq.addListener(onChange); }
  }

  document.body.appendChild(btn);
});
</script>

<!-- Mermaid diagram rendering -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  /* ---- Mermaid: convert fenced ```mermaid blocks into rendered diagrams ----
     kramdown + rouge wraps fenced ```mermaid as:
       <div class="language-mermaid highlighter-rouge"><div class="highlight">
         <pre class="highlight"><code>...</code></pre></div></div>
     (or, without highlighting, <pre><code class="language-mermaid">...). We
     collect the raw text, replace the wrapper with a <div class="mermaid">,
     then run mermaid on those nodes. */
  if (typeof mermaid !== 'undefined') {
    var mermaidDark = document.documentElement.getAttribute('data-theme') === 'dark';
    mermaid.initialize({
      startOnLoad: false,
      theme: mermaidDark ? 'dark' : 'neutral',
      securityLevel: 'loose'
    });

    var mermaidBlocks = [];
    // rouge-highlighted form
    document.querySelectorAll('div.language-mermaid, code.language-mermaid').forEach(function (node) {
      var codeEl = node.matches('code') ? node : node.querySelector('code');
      var source = (codeEl ? codeEl.textContent : node.textContent) || '';
      // The outermost replaceable wrapper: the .language-mermaid wrapper div,
      // else the enclosing <pre>, else the node itself.
      var wrapper = node.closest('div.language-mermaid') || node.closest('pre') || node;
      var holder = document.createElement('div');
      holder.className = 'mermaid';
      holder.textContent = source.trim();
      wrapper.parentNode.replaceChild(holder, wrapper);
      mermaidBlocks.push(holder);
    });

    if (mermaidBlocks.length) {
      try {
        mermaid.run({ nodes: mermaidBlocks });
      } catch (e) {
        // mermaid <10.3 fallback
        if (mermaid.init) { mermaid.init(undefined, mermaidBlocks); }
      }
    }
  }

  /* ---- Heading anchor links (h2/h3/h4 inside content) ---- */
  var content = document.querySelector('.page__content');
  if (content) {
    var slugCounts = {};
    function slugify(text) {
      var base = text.toLowerCase().trim()
        .replace(/[^\w\s-]/g, '')
        .replace(/\s+/g, '-')
        .replace(/-+/g, '-');
      if (!base) base = 'section';
      if (slugCounts[base] === undefined) { slugCounts[base] = 0; return base; }
      slugCounts[base] += 1;
      return base + '-' + slugCounts[base];
    }

    var headings = content.querySelectorAll('h2, h3, h4');
    headings.forEach(function (h) {
      if (!h.id) { h.id = slugify(h.textContent || ''); }
      else { slugCounts[h.id] = 0; }
      var a = document.createElement('a');
      a.className = 'heading-anchor';
      a.href = '#' + h.id;
      a.setAttribute('aria-label', 'Link to this section');
      a.innerHTML = '<i class="fas fa-link"></i>';
      h.appendChild(a);
    });

    /* ---- Build the "On This Page" TOC when page front matter sets toc:true ---- */
    var wantsToc = {{ page.toc | default: false | jsonify }};
    var tocHeadings = Array.prototype.filter.call(
      content.querySelectorAll('h2, h3'),
      function (h) { return (h.textContent || '').trim().length > 0; }
    );
    if (wantsToc && tocHeadings.length >= 3 && window.innerWidth >= 1400) {
      var nav = document.createElement('nav');
      nav.className = 'doc-toc';
      nav.setAttribute('aria-label', 'On this page');
      var html = '<p class="doc-toc__title">On This Page</p><ul>';
      tocHeadings.forEach(function (h) {
        var cls = h.tagName.toLowerCase() === 'h3' ? 'toc-h3' : 'toc-h2';
        var label = h.textContent.replace(/\s*$/, '');
        html += '<li><a class="' + cls + '" href="#' + h.id + '">' + label + '</a></li>';
      });
      html += '</ul>';
      nav.innerHTML = html;
      document.body.appendChild(nav);
      document.body.classList.add('has-doc-toc');

      /* Scroll-spy: highlight the current section */
      var links = nav.querySelectorAll('a');
      var byId = {};
      links.forEach(function (l) { byId[l.getAttribute('href').slice(1)] = l; });
      if ('IntersectionObserver' in window) {
        var observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            var l = byId[entry.target.id];
            if (!l) return;
            if (entry.isIntersecting) {
              links.forEach(function (x) { x.classList.remove('is-active'); });
              l.classList.add('is-active');
            }
          });
        }, { rootMargin: '0px 0px -75% 0px', threshold: 0 });
        tocHeadings.forEach(function (h) { observer.observe(h); });
      }
    }

    /* ---- Copy-to-clipboard buttons on code blocks ---- */
    content.querySelectorAll('pre').forEach(function (pre) {
      if (pre.querySelector('.mermaid')) return;
      var code = pre.querySelector('code');
      if (!code) return;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'code-copy-btn';
      btn.textContent = 'Copy';
      btn.addEventListener('click', function () {
        var text = code.innerText;
        function done() {
          btn.textContent = 'Copied!';
          btn.classList.add('copied');
          setTimeout(function () { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1600);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, done);
        } else {
          var ta = document.createElement('textarea');
          ta.value = text; document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); } catch (e) {}
          document.body.removeChild(ta); done();
        }
      });
      pre.appendChild(btn);
    });
  }

  /* ---- Smooth scroll for in-page anchor links ---- */
  document.querySelectorAll('a[href^="#"]').forEach(function (anchor) {
    anchor.addEventListener('click', function (e) {
      var id = this.getAttribute('href');
      if (id.length <= 1) return;
      var target = document.getElementById(id.slice(1));
      if (target) {
        e.preventDefault();
        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        if (history.pushState) { history.pushState(null, '', id); }
      }
    });
  });
});
</script>
